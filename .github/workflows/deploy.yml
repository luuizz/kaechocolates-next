# Publica a main em produção (kaechocolates.luricweb.com.br).
# O deploy automático da Vercel pelo Git fica desligado (vercel.json):
# quem publica é esta esteira, depois do CI passar na PR dev → main.
# Antes de publicar, aplica as migrations pendentes no Neon.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Banco (migrations)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - name: Confere a connection string
        id: check
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret NEON_DATABASE_URL não configurado: migrations não foram aplicadas. Veja o README (Banco)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.check.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: yarn
      - if: steps.check.outputs.skip != 'true'
        run: yarn install --frozen-lockfile
      - if: steps.check.outputs.skip != 'true'
        run: yarn db:migrate
      - name: Recarrega o cache da Data API
        if: steps.check.outputs.skip != 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY || secrets.NEON_API_KEY_KAE }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH: ${{ vars.NEON_BRANCH || 'production' }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::Sem NEON_API_KEY e NEON_PROJECT_ID: se a migration mudou tabelas, rode 'neon data-api refresh-schema --database neondb'."
            exit 0
          fi
          npx -y neonctl@8 data-api refresh-schema --project-id "$NEON_PROJECT_ID" --branch "$NEON_BRANCH" --database neondb

  deploy:
    name: Publicar na Vercel
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Confere a configuração
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no GitHub (Settings → Secrets and variables → Actions):$missing. Veja o README (Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Instala a Vercel CLI
        run: npm install --global vercel@65
      - name: Baixa a configuração do projeto
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publica
        id: publish
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"
