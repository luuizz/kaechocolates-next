# Publica a main em produção (kaechocolates.luricweb.com.br).
# O deploy automático da Vercel pelo Git fica desligado (vercel.json):
# quem publica é esta esteira, depois do CI passar na PR dev → main.
# Quando o banco entrar, um job de migrations roda antes deste.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar na Vercel
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publish.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Confere a configuração
        run: |
          missing=""
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Faltam no GitHub (Settings → Secrets and variables → Actions):$missing. Veja o README (Deploy)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - name: Instala a Vercel CLI
        run: npm install --global vercel@65
      - name: Baixa a configuração do projeto
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Publica
        id: publish
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"
