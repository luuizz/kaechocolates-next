# Validação de toda mudança antes de entrar na dev ou na main.
# Roda em PRs (feature → dev e dev → main) e em pushes na dev.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A main só recebe código vindo da dev (esteira dev → main)
  origem:
    name: Origem do PR
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: PR para a main precisa vir da dev
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::PRs para a main devem sair da branch dev (recebido: $HEAD_REF). Abra o PR para a dev primeiro."
            exit 1
          fi
          echo "Origem ok: dev → main"

  front:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn build
        # Sem endereços do Neon: o build usa o catálogo local (src/data)

  database:
    name: Migrations (Postgres de teste)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Simula o Neon Auth + Data API
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/ci/neon-stub.sql
      - name: Aplica as migrations do zero
        run: yarn db:migrate
      - name: Segunda execução não aplica nada
        run: yarn db:migrate | tee out.txt && grep -q "Banco em dia" out.txt

  e2e:
    name: Testes de ponta a ponta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tudo roda simulado dentro do job (login, Data API, Mercado Pago): sem secrets
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Instala o PostgREST (a Data API do Neon)
        run: |
          curl -fsSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz \
            | sudo tar -xJ -C /usr/local/bin postgrest \
            || { id=$(docker create postgrest/postgrest:v12.2.3) && docker cp "$id:/bin/postgrest" ./postgrest && docker rm "$id" && sudo mv ./postgrest /usr/local/bin/postgrest; }
          postgrest --version
      - name: Instala o navegador
        run: yarn playwright install --with-deps chromium
      - name: Testes
        run: yarn e2e
      - name: Relatório (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
